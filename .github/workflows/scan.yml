name: Odd Repo Scan

on:
  schedule:
    # Hourly at :14 UTC — keep under GH Actions free-tier pressure
    - cron: '14 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odd-repo-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scanner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTIONS: 'true'
        run: |
          python3 scripts/scan.py

      - name: Commit updated hits (if changed)
        run: |
          if [ ! -f .scan-changed ] || [ "$(cat .scan-changed)" != "1" ]; then
            echo "No material changes — skipping commit."
            exit 0
          fi
          git config user.name "odd-repo-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/hits.json
          if git diff --cached --quiet; then
            echo "hits.json unchanged after add — skipping."
            exit 0
          fi
          git commit -m "chore(scan): update hits.json"
          git push
